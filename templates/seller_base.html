<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Panel | NAV Merchandise</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

        /* ── Navigation bar ─────────────────────── */
        nav {
            background-color: #2c3e50;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-links { display: flex; gap: 6px; }
        .nav-links a {
            color: #bdc3c7;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 7px 14px;
            border-radius: 5px;
            transition: background-color 0.2s, color 0.2s;
        }
        .nav-links a:hover { background-color: #3d5166; color: white; }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .nav-user {
            color: #aaa;
            font-size: 0.85rem;
        }
        .btn-logout {
            background-color: #e74c3c;
            color: white;
            text-decoration: none;
            padding: 7px 14px;
            border-radius: 5px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .btn-logout:hover { background-color: #c0392b; }

        /* ── Messages Framework styles ───────────── */
        .messages-container { padding: 12px 24px 0; }

        .alert {
            padding: 11px 15px;
            border-radius: 6px;
            font-size: 0.88rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .alert-error  { background: #fdecea; color: #c0392b; border-left: 4px solid #c0392b; }
        .alert-success { background: #eafaf1; color: #1e8449; border-left: 4px solid #27ae60; }
        .alert-warning { background: #fef9e7; color: #9a7d0a; border-left: 4px solid #f1c40f; }
        .alert-info    { background: #ebf5fb; color: #1a5276; border-left: 4px solid #2980b9; }

        /* ── Page content ────────────────────────── */
        .content { padding: 28px 24px; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-links">
            <a href="{% url 'seller_dashboard' %}">Dashboard</a>
            <a href="{% url 'seller_add_product' %}">Add Product</a>
            <a href="{% url 'seller_products' %}">Products</a>
        </div>

        <div class="nav-right">
            <span class="nav-user">👤 {{ request.user.username }}</span>
            <a href="{% url 'seller_logout' %}" class="btn-logout">Logout</a>
        </div>
    </nav>
    {% if messages %}
    <div class="messages-container">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <div class="content">
        {% block content %}{% endblock %}
    </div>

</body>
</html>

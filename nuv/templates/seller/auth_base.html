<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Seller{% endblock %} | NAV Merchandise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; min-height: 100vh; }
        .brand-bar { background: #1b365d; color: #fff; border-radius: .5rem .5rem 0 0; }
        .brand-bar small { color: #aac4e8; }
        .btn-brand { background: #1b365d; color: #fff; }
        .btn-brand:hover { background: #2c4d75; color: #fff; }
        a { color: #1b365d; }
    </style>
</head>
<body class="d-flex align-items-center py-4">
<div class="container" style="max-width: {% block width %}440px{% endblock %};">
    <div class="brand-bar text-center p-3">
        <h1 class="h4 mb-1">NAV Merchandise</h1>
        <small>{% block subtitle %}Seller Panel{% endblock %}</small>
    </div>
    <div class="card shadow border-0 rounded-top-0">
        <div class="card-body p-4">

            {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} py-2" role="alert">
                {{ message }}
            </div>
            {% endfor %}

            {% if form.non_field_errors %}
            <div class="alert alert-danger py-2" role="alert">
                {% for error in form.non_field_errors %}<div>{{ error }}</div>{% endfor %}
            </div>
            {% endif %}

            {% block content %}{% endblock %}
        </div>
    </div>
</div>
</body>
</html>

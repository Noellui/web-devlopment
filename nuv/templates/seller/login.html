<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Login | NAV Merchandise</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f2f5;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        /* Brand header strip */
        .brand-bar {
            background-color: #1b365d;
            color: white;
            text-align: center;
            padding: 18px;
            border-radius: 10px 10px 0 0;
        }
        .brand-bar h1 { font-size: 1.3rem; letter-spacing: 1px; }
        .brand-bar p { font-size: 0.8rem; color: #aac4e8; margin-top: 4px; }


        .login-card {
            background: white;
            padding: 32px;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
        }

        .messages { margin-bottom: 20px; }

        .alert {
            padding: 11px 15px;
            border-radius: 6px;
            font-size: 0.88rem;
            margin-bottom: 8px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .alert::before { font-size: 1rem; flex-shrink: 0; }

        .alert-error {
            background-color: #fdecea;
            color: #c0392b;
            border-left: 4px solid #c0392b;
        }
        .alert-error::before { content: '✕'; }

        .alert-success {
            background-color: #eafaf1;
            color: #1e8449;
            border-left: 4px solid #27ae60;
        }
        .alert-success::before { content: '✓'; }

        .alert-warning {
            background-color: #fef9e7;
            color: #9a7d0a;
            border-left: 4px solid #f1c40f;
        }
        .alert-warning::before { content: '!'; }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.88rem;
        }

        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #dce1e7;
            border-radius: 6px;
            font-size: 0.95rem;
            color: #2c3e50;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #1b365d;
            box-shadow: 0 0 0 3px rgba(27, 54, 93, 0.12);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #1b365d;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background-color 0.2s;
            margin-top: 4px;
        }
        .btn-login:hover { background-color: #2c4d75; }
        .btn-login:active { background-color: #142748; }

        .back-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #eee;
        }
        .back-link a {
            color: #1b365d;
            text-decoration: none;
            font-size: 0.88rem;
        }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="login-wrapper">

    <div class="brand-bar">
        <h1>NAV Merchandise</h1>
        <p>Seller Panel — Please sign in to continue</p>
    </div>

    <div class="login-card">

        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <div class="back-link">
            <a href="{% url 'dashboard' %}">← Back to Store</a>
        </div>

    </div>
</div>

</body>
</html>

{% extends 'base.html' %}
{% load static %}
{% block content %}

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; padding: 20px;">
    {% for product in products %}
    <div style="border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden;">
        {% if product.p_img %}
            <img src="{{ product.p_img.url }}" alt="{{ product.p_title }}" style="width:100%; height:220px; object-fit:cover;">
        {% endif %}
        <div style="padding: 15px;">
            <h3>{{ product.p_title }}</h3>
            <p>{{ product.p_description }}</p>
            <p><strong>{{ product.p_price }}</strong></p>
        </div>
    </div>
    {% empty %}
    <p>No products available.</p>
    {% endfor %}
</div>

{% endblock %}
